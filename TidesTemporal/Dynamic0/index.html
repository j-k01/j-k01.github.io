<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harmonic Tides Prototype</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.156.1/build/three.module.js"
        }
      }
    </script>
    <style>
      html, body { height: 100%; margin: 0; background: #000; color: #fff; font-family: Arial, sans-serif; }
      #ui { position: fixed; top: 8px; left: 8px; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 4px; }
      #ui label { display:block; margin:4px 0; }
    </style>
  </head>
  <body>
    <div id="ui">
      <div>
        <button id="play">Play</button>
        <button id="pause">Pause</button>
        <input id="datetime" type="datetime-local" step="1" />
        <button id="jump">Go</button>
        <span id="tlabel"></span>
      </div>
      <label>FPS <input id="fps" type="range" min="1" max="60" value="31"/></label>
      <label>Exag <input id="exag" type="range" min="10" max="10000" step="5" value="3505"/></label>
      <label>Range (m) <input id="range" type="range" min="0.1" max="50" step="0.1" value="50"/></label>
      <label>Greenness <input id="green" type="range" min="0" max="1" step="0.01" value="0"/></label>
    </div>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.156.1/examples/jsm/controls/OrbitControls.js';

      async function main() {
        // Load real harmonics exported from GOT5.5/5.6
        async function loadHarm(){
          const url = 'harmonics_demo.json';
          try {
            const r = await fetch(url, { cache: 'no-cache' });
            if (r.ok) {
              console.log('Loaded harmonics from', url);
              return await r.json();
            } else {
              console.warn('Failed to load', url, r.status, r.statusText);
              return null;
            }
          } catch (e) {
            console.warn('Error fetching', url, e);
            return null;
          }
        }
        const harm = await loadHarm();
        if (!harm) {
          const msg = 'Failed to load harmonics data';
          console.error(msg);
          const div = document.createElement('div');
          div.textContent = msg;
          div.style.position = 'fixed';
          div.style.top = '50%';
          div.style.left = '50%';
          div.style.transform = 'translate(-50%, -50%)';
          div.style.background = 'rgba(0,0,0,0.7)';
          div.style.padding = '12px 16px';
          div.style.borderRadius = '6px';
          document.body.appendChild(div);
          return; // Stop execution if no data
        }

        const lats = harm.latitudes;
        const lons = harm.longitudes;
        const N = lats.length;
        const names = harm.meta.constituents;
        const K = names.length;
        const land = harm.land_mask || new Array(N).fill(false);

        // Convert to typed arrays and compute angular speeds from periods (use simplified Doodson where known or fallback approx).
        // For now, accept a static mapping for common constituents; others default to zero (static phase contribution).
        const periodHours = {
          'M2': 12.4206012, 'S2': 12.0000000, 'N2': 12.6583475, 'K2': 11.9672361, 'K1': 23.9344721, 'O1': 25.8193387,
          'P1': 24.065889, 'Q1': 26.868356, 'M4': 6.2103006, 'MS4': 6.0, 'S1': 24.0, 'OO1': 22.30608, 'SIG1': 22.3972,
          '2N2': 12.905374, 'J1': 23.0985, 'M3': 8.2804008
        };
        const Omega = new Float64Array(K);
        for (let k=0;k<K;k++) {
          const name = names[k].toUpperCase();
          const ph = periodHours[name];
          Omega[k] = ph ? (2*Math.PI/(ph*3600)) : 0.0;
        }
        // Flatten amplitudes/phases into typed arrays (amplitudes: meters; phases: radians)
        const A = new Float32Array(N*K);
        const Phi = new Float32Array(N*K);
        for (let k=0;k<K;k++) {
          const ak = harm.amplitudes[k];
          const pk = harm.phases[k];
          for (let s=0;s<N;s++) {
            const idx = s*K + k;
            A[idx] = ak[s] || 0;
            Phi[idx] = pk[s] || 0;
          }
        }

        // Worker
        const worker = new Worker('harmonic_worker.js', { type: 'module' });
        let ready = false;
        worker.postMessage({ type:'init', N, K, A, Phi, Omega });
        worker.onmessage = (ev) => {
          const { type } = ev.data || {};
          if (type === 'ready') { 
            ready = true; 
            worker.postMessage({ type:'compute', tSeconds: simTime });
          }
          if (type === 'result') { applyElevations(ev.data.elevations); }
        };

        // Three.js scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias:true });
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);
        const controls = new OrbitControls(camera, renderer.domElement);
        camera.position.set(0, 0, 16);
        controls.update();

        const earthR = 6.37;
        let ptsGeom = new THREE.BufferGeometry();
        const vertices = [];
        for (let i=0;i<N;i++) {
          const lat = lats[i]*Math.PI/180;
          const lon = -lons[i]*Math.PI/180; // flip for view
          const x = earthR*Math.cos(lat)*Math.cos(lon);
          const y = earthR*Math.sin(lat);
          const z = earthR*Math.cos(lat)*Math.sin(lon);
          vertices.push(x,y,z);
        }
        ptsGeom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        const colors = new Float32Array(N*3);
        // Initialize all points to white so they're visible immediately
        for (let i=0; i<N*3; i+=3) {
          colors[i] = 1.0; colors[i+1] = 1.0; colors[i+2] = 1.0;
        }
        ptsGeom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        const vertexSize = 0.08;
        const pointsMaterial = new THREE.PointsMaterial({ vertexColors:true, size:vertexSize });
        const points = new THREE.Points(ptsGeom, pointsMaterial);
        scene.add(points);
        console.log(`Created ${N} points on sphere`);

        // Occluder disc to hide back half of the globe
        const occluderGeometry = new THREE.CircleGeometry(earthR + 0.1, 64);
        const occluderMaterial = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide });
        const occluder = new THREE.Mesh(occluderGeometry, occluderMaterial);
        scene.add(occluder);

        const metersToUnits = earthR / 6371000;
        const basePos = ptsGeom.attributes.position.array.slice();
        let isPlaying = true;
        let fps = 12;
        let exag = 5000;
        let range = 50.0;
        const playBtn = document.getElementById('play');
        const pauseBtn = document.getElementById('pause');
        const dtInput = document.getElementById('datetime');
        const jumpBtn = document.getElementById('jump');
        const fpsSlider = document.getElementById('fps');
        const exagSlider = document.getElementById('exag');
        const rangeSlider = document.getElementById('range');
        const greenSlider = document.getElementById('green');
        const tlabel = document.getElementById('tlabel');
        // Initialize range from slider to keep in sync
        range = parseFloat(rangeSlider.value);
        // Initialize fps and exag from sliders (defaults set in HTML)
        fps = parseInt(fpsSlider.value,10);
        exag = parseInt(exagSlider.value,10);
        playBtn.onclick = ()=>{isPlaying=true;};
        pauseBtn.onclick = ()=>{isPlaying=false;};
        fpsSlider.oninput = (e)=>{ fps = parseInt(e.target.value,10); };
        exagSlider.oninput = (e)=>{ exag = parseInt(e.target.value,10); };
        rangeSlider.oninput = (e)=>{ range = parseFloat(e.target.value); };

        function updateLandColors() {
          if (!ptsGeom) return;
          const colors = ptsGeom.attributes.color.array;
          for (let i = 0; i < N; i++) {
            if (land[i]) {
              const b = i * 3;
              const lat = lats[i];
              if (Math.abs(lat) >= 66.5) {
                colors[b]=colorWhite.r; colors[b+1]=colorWhite.g; colors[b+2]=colorWhite.b;
              } else {
                colors[b] = colorGreen.r;
                colors[b+1] = colorGreen.g;
                colors[b+2] = colorGreen.b;
              }
            }
          }
          if (ptsGeom.attributes.color) ptsGeom.attributes.color.needsUpdate = true;
        }

        greenSlider.oninput = (e) => {
          colorGreen.g = parseFloat(e.target.value);
          updateLandColors();
        };

        const colorGold = new THREE.Color(0xffd700);
        const colorWhite = new THREE.Color(0xffffff);
        const colorBlue = new THREE.Color(0x0077ff);
        let colorGreen = new THREE.Color(0x000066);
        const colorDeep = new THREE.Color(0x001b3a);
        const tmp = new THREE.Color();

        let simTime = 0; // seconds since epoch (UTC)
        let last = 0;
        // Time controls: set an ISO start time
        const startISO = new Date('2025-09-01T00:00:00Z');
        const oneSecond = 1000;
        function setSimTimeFromDate(dateObj){
          simTime = (dateObj.getTime() - new Date('1970-01-01T00:00:00Z').getTime())/1000;
        }
        setSimTimeFromDate(startISO);
        // Initialize datetime-local to the start time in local timezone
        function toLocalDateTimeInputValue(d){
          const pad = (n)=>String(n).padStart(2,'0');
          return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        }
        dtInput.value = toLocalDateTimeInputValue(startISO);
        jumpBtn.onclick = ()=>{
          // Interpret input as local time; convert to UTC seconds
          const val = dtInput.value; // yyyy-mm-ddThh:mm:ss
          if (!val) return;
          const local = new Date(val.replace('T',' ') + ' UTC');
          if (isNaN(local.getTime())) return;
          setSimTimeFromDate(local);
          // request immediate recompute at this time
          worker.postMessage({ type:'compute', tSeconds: simTime });
        };
        function animate(ts){
          requestAnimationFrame(animate);
          if (!ready) { renderer.render(scene,camera); return; }
          const dt = (ts - last) / 1000;
          last = ts;
          if (isPlaying) {
            simTime += (3600 * (fps/12)) * dt; // advance ~fps hours per real second
            worker.postMessage({ type:'compute', tSeconds: simTime });
          }
          controls.update();
          occluder.lookAt(camera.position);
          renderer.render(scene, camera);
        }

        function applyElevations(elev){
          // Update positions and colors
          const colors = ptsGeom.attributes.color.array;
          const pos = ptsGeom.attributes.position.array;
          // Diagnostics: verify range usage
          let rawMin = Infinity, rawMax = -Infinity;
          let clampLow = 0, clampHigh = 0, finiteCount = 0;
          for (let i=0;i<N;i++){
            const e = elev[i];
            if (Number.isFinite(e)) {
              finiteCount++;
              if (e < rawMin) rawMin = e;
              if (e > rawMax) rawMax = e;
              if (e <= -range) clampLow++;
              if (e >=  range) clampHigh++;
            }
          }
          for (let i=0;i<N;i++){
            const b = i*3;
            // For land points, elevation is not applicable, but we need to set its color
            // and ensure its position is on the base sphere.
            if (land[i]) {
              const lat = lats[i];
              if (Math.abs(lat) >= 66.5) {
                colors[b]=colorWhite.r; colors[b+1]=colorWhite.g; colors[b+2]=colorWhite.b;
              } else {
                colors[b]=colorGreen.r; colors[b+1]=colorGreen.g; colors[b+2]=colorGreen.b;
              }
              const vx = basePos[b], vy = basePos[b+1], vz = basePos[b+2];
              pos[b] = vx; pos[b+1] = vy; pos[b+2] = vz;
              continue;
            }
            // For ocean points, apply displacement and color gradient
            const disp = elev[i] * metersToUnits * exag;
            const vx = basePos[b], vy = basePos[b+1], vz = basePos[b+2];
            const mag = Math.hypot(vx,vy,vz);
            const nx = vx/mag, ny = vy/mag, nz = vz/mag;
            pos[b] = vx + nx*disp;
            pos[b+1] = vy + ny*disp;
            pos[b+2] = vz + nz*disp;

            const v = Math.max(-range, Math.min(range, elev[i]));
            // White (low) -> Blue (zero) -> Dark Blue (high)
            if (v <= 0) {
              let u = (v + range) / range; // -range..0 => 0..1
              // slight ease for smoothness
              u = Math.sqrt(Math.max(0, Math.min(1, u)));
              tmp.lerpColors(colorWhite, colorBlue, u);
            } else {
              let u = v / range; // 0..range => 0..1
              u = Math.sqrt(Math.max(0, Math.min(1, u)));
              tmp.lerpColors(colorBlue, colorDeep, u);
            }
            colors[b]=tmp.r; colors[b+1]=tmp.g; colors[b+2]=tmp.b;
          }
          ptsGeom.attributes.position.needsUpdate = true;
          ptsGeom.attributes.color.needsUpdate = true;
          const d = new Date(simTime*1000);
          const lowPct = finiteCount ? Math.round((clampLow/finiteCount)*100) : 0;
          const highPct = finiteCount ? Math.round((clampHigh/finiteCount)*100) : 0;
          tlabel.textContent = d.toISOString().replace('T',' ').replace('Z','Z');
        }

        animate(0);
      }

      main().catch(err => console.error("App failed to start:", err));
    </script>
  </body>
  </html>
