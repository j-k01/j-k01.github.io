<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tidal Harmonics Visualization</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.156.1/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    
    <div id="ui">
      <div>
        <button id="play-pause">▶</button>
        <label>Speed <input id="speed" type="range" min="0.1" max="10" step="0.1" value="1"/></label>
        <span id="tlabel">Loading...</span>
      </div>
      <div>
        <label>Exaggeration <input id="exaggeration" type="range" min="0.1" max="5" step="0.1" value="1"/></label>
      </div>
      <div>
        <label style="display: none;">Range (m) <input id="range" type="range" min="0.1" max="1" step="0.01" value="0.4"/></label>
        <label style="display: none;">Goldness <input id="gold" type="range" min="0" max="1" step="0.01" value="0"/></label>
        <label style="display: none;">Ocean Glow <input id="ocean-glow" type="range" min="0" max="1" step="0.01" value="0.15"/></label>
        <div style="display: none;">
          <div class="button-row">
            <button id="oceanic" class="active-colorway">Oceanic</button>
            <button id="digital">Digital</button>
            <button id="thermal">Thermal</button>
            <button id="monochrome">Monochrome</button>
          </div>
          
          <div id="oceanic-land-options" class="button-row" style="display: none;">
            <span>Land: </span>
            <button id="oceanic-visible" class="active-colorway">Visible</button>
            <button id="oceanic-dark">Dark</button>
            <button id="oceanic-bright">Bright</button>
          </div>
          
          <div id="digital-land-options" class="button-row" style="display: none;">
            <span>Style: </span>
            <button id="digital-neon" class="active-colorway">Neon</button>
            <button id="digital-matrix">Matrix</button>
            <button id="digital-cyber">Cyber</button>
          </div>
        </div>
      </div>
    </div>

    <div id="graph-container">
      <div id="graph-info"></div>
      <canvas id="tidal-graph"></canvas>
      <button id="close-graph-btn" title="Close Graph">&times;</button>
    </div>

    <script type="x-shader/x-vertex" id="vertexshader">
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
      }
    </script>
    <script type="x-shader/x-fragment" id="fragmentshader">
      uniform sampler2D baseTexture;
      uniform sampler2D bloomTexture;
      varying vec2 vUv;
      void main() {
        gl_FragColor = ( texture2D( baseTexture, vUv ) + vec4( 1.0 ) * texture2D( bloomTexture, vUv ) );
      }
    </script>

    <script type="module" src="main.js"></script>
  </body>
</html>
